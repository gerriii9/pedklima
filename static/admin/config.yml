# Admin bežiaci na /admin/ (Decap CMS + Netlify Identity + Git Gateway)
backend:
  name: git-gateway
  branch: main

locale: sk
site_url: /
display_url: /
logo_url: /images/pedklima-logo.svg
media_folder: static/images/realizacie
public_folder: /images/realizacie

collections:
  - name: obsah
    label: Obsah webu
    editor: { preview: false }
    files:
      - name: realizacie
        label: "Fotky realizácií"
        file: content/realizacie.json
        format: json
        fields:
          - label: "Fotky"
            name: polozky
            widget: list
            summary: "{{fields.popis_sk}}"
            fields:
              - { label: "Fotka", name: foto, widget: image }
              - { label: "Popis po slovensky", name: popis_sk, widget: string }
              - { label: "Popis po maďarsky", name: popis_hu, widget: string }
      - name: recenzie
        label: "Recenzie z Googlu"
        file: content/recenzie.json
        format: json
        fields:
          - { label: "Hodnotenie na Googli", name: hodnotenie, widget: string, hint: "Napríklad 5,0" }
          - { label: "Počet hodnotení", name: pocet, widget: string }
          - { label: "Odkaz na profil Google", name: odkaz, widget: string }
          - label: "Recenzie"
            name: polozky
            widget: list
            summary: "{{fields.meno}}"
            fields:
              - { label: "Meno", name: meno, widget: string }
              - { label: "Text recenzie", name: text, widget: text }
      - name: nastavenia
        label: "Kontakt a firemné údaje"
        file: content/nastavenia.json
        format: json
        fields:
          - { label: "Hlavný telefón", name: telefon1, widget: string }
          - { label: "Druhý telefón", name: telefon2, widget: string, required: false }
          - { label: "E-mail", name: email, widget: string }
          - { label: "Odkaz na Facebook", name: facebook, widget: string, required: false }
          - { label: "Oblasť pôsobenia po slovensky", name: pusobnost_sk, widget: string, required: false }
          - { label: "Oblasť pôsobenia po maďarsky", name: pusobnost_hu, widget: string, required: false }
          - { label: "Názov firmy", name: firma, widget: string, required: false }
          - { label: "IČO", name: ico, widget: string, required: false }
          - { label: "Adresa", name: adresa, widget: string, required: false }
          - { label: "Skryť web pred Googlom", name: skryt_pred_googlom, widget: boolean, default: true, required: false, hint: "Po spustení webu vypnúť" }
      - name: sk
        label: "Texty po slovensky"
        file: content/sk.json
        format: json
        fields:
          - { label: "SEO titulok", name: seo_titulok, widget: string }
          - { label: "SEO popis", name: seo_popis, widget: text }
          - label: "Úvod: veľké riadky"
            name: hero_riadky
            widget: list
            summary: "{{fields.text}}"
            field: { label: "Riadok", name: text, widget: string }
          - { label: "Úvod: slogan", name: hero_slogan, widget: string }
          - { label: "Úvod: text", name: hero_text, widget: text }
          - { label: "Úvod: fotka", name: hero_foto, widget: image }
          - { label: "Úvod: popis fotky", name: hero_foto_popis, widget: string }
          - { label: "Služby: nadpis", name: sluzby_nadpis, widget: string }
          - label: "Služby"
            name: sluzby
            widget: list
            summary: "{{fields.nazov}}"
            fields:
              - { label: "Názov", name: nazov, widget: string }
              - { label: "Text", name: text, widget: text }
              - { label: "Fotka", name: foto, widget: image }
              - { label: "Popis fotky", name: foto_popis, widget: string }
          - { label: "Čistenie: nadpis", name: cistenie_nadpis, widget: string }
          - { label: "Čistenie: text", name: cistenie_text, widget: text }
          - { label: "Čistenie: tlačidlo", name: cistenie_tlacidlo, widget: string }
          - { label: "Čistenie: fotka pred", name: cistenie_pred_foto, widget: image }
          - { label: "Čistenie: popis fotky pred", name: cistenie_pred_popis, widget: string }
          - { label: "Čistenie: fotka po", name: cistenie_po_foto, widget: image }
          - { label: "Čistenie: popis fotky po", name: cistenie_po_popis, widget: string }
          - { label: "Realizácie: nadpis", name: realizacie_nadpis, widget: string }
          - { label: "Realizácie: text", name: realizacie_text, widget: text }
          - { label: "Kontakt: nadpis", name: kontakt_nadpis, widget: string }
          - { label: "Kontakt: text", name: kontakt_text, widget: text }
      - name: hu
        label: "Texty po maďarsky"
        file: content/hu.json
        format: json
        fields:
          - { label: "SEO titulok", name: seo_titulok, widget: string }
          - { label: "SEO popis", name: seo_popis, widget: text }
          - label: "Úvod: veľké riadky"
            name: hero_riadky
            widget: list
            summary: "{{fields.text}}"
            field: { label: "Riadok", name: text, widget: string }
          - { label: "Úvod: slogan", name: hero_slogan, widget: string }
          - { label: "Úvod: text", name: hero_text, widget: text }
          - { label: "Úvod: fotka", name: hero_foto, widget: image }
          - { label: "Úvod: popis fotky", name: hero_foto_popis, widget: string }
          - { label: "Služby: nadpis", name: sluzby_nadpis, widget: string }
          - label: "Služby"
            name: sluzby
            widget: list
            summary: "{{fields.nazov}}"
            fields:
              - { label: "Názov", name: nazov, widget: string }
              - { label: "Text", name: text, widget: text }
              - { label: "Fotka", name: foto, widget: image }
              - { label: "Popis fotky", name: foto_popis, widget: string }
          - { label: "Čistenie: nadpis", name: cistenie_nadpis, widget: string }
          - { label: "Čistenie: text", name: cistenie_text, widget: text }
          - { label: "Čistenie: tlačidlo", name: cistenie_tlacidlo, widget: string }
          - { label: "Čistenie: fotka pred", name: cistenie_pred_foto, widget: image }
          - { label: "Čistenie: popis fotky pred", name: cistenie_pred_popis, widget: string }
          - { label: "Čistenie: fotka po", name: cistenie_po_foto, widget: image }
          - { label: "Čistenie: popis fotky po", name: cistenie_po_popis, widget: string }
          - { label: "Realizácie: nadpis", name: realizacie_nadpis, widget: string }
          - { label: "Realizácie: text", name: realizacie_text, widget: text }
          - { label: "Kontakt: nadpis", name: kontakt_nadpis, widget: string }
          - { label: "Kontakt: text", name: kontakt_text, widget: text }
